<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirm - LokalMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">Lokal<span>Mart</span></a>
      <div class="nav-links">
        <a href="../index.html">முகப்பு</a>
        <a href="shops.html">கடைகள்</a>
        <a href="order-history.html">Orders</a>
      </div>
      <button class="lang-toggle" onclick="toggleLanguage()"><span id="lang-label">EN</span><i class="fa fa-globe"></i></button>
    </div>
  </nav>

  <main class="section">
    <div class="card" style="max-width: 500px; margin: 40px auto; padding: 40px 24px; text-align: center;">
      <div style="width: 80px; height: 80px; background: var(--green-light); color: var(--green); border-radius: 50%; font-size: 40px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
        <i class="fa fa-check"></i>
      </div>
      
      <h2 class="tamil" style="margin-bottom: 8px;">ஆர்டருக்கு நன்றி!</h2>
      <p class="tamil muted" style="margin-bottom: 24px;">உங்கள் ஆர்டர் கடைக்காரருக்கு அனுப்பப்பட்டது.</p>
      
      <div style="background: var(--faint); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 24px; text-align: left;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span class="muted">Order ID:</span>
          <span style="font-weight: 700;">#MDU-2841</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span class="muted tamil">கடை:</span>
          <span class="tamil" style="font-weight: 600;">Sri Murugan Grocery</span>
        </div>
      </div>

      <button class="btn btn-primary btn-full tamil" onclick="window.location.href='order-history.html'">ஆர்டர் நிலையை பார் (Track)</button>
      <button class="btn btn-outline btn-full tamil" onclick="window.location.href='../index.html'" style="margin-top: 12px;">முகப்புக்கு செல்</button>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/language.js"></script>
</body>
</html>
