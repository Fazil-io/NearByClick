<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NearBy Click</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">NearBy<span>Click</span></a>
      <div class="nav-links">
        <a href="index.html">முகப்பு</a>
        <a href="customer/shops.html">கடைகள்</a>
      </div>
      <button class="lang-toggle" onclick="toggleLanguage()">
        <span id="lang-label">EN</span>
        <i class="fa fa-globe"></i>
      </button>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="section">
    <div class="card" style="max-width: 400px; margin: 40px auto; padding: 32px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 class="tamil" style="margin-bottom: 8px;">உள்நுழைய</h2>
        <p class="muted tamil" style="font-size: 14px;">உங்கள் மொபைல் எண்ணை உள்ளிடவும்</p>
      </div>

      <div class="form-group">
        <label class="tamil">மொபைல் எண் (Mobile Number)</label>
        <div style="position: relative;">
          <span style="position: absolute; left: 12px; top: 12px; color: var(--muted);">+91</span>
          <input type="tel" placeholder="98765 43210" style="padding-left: 48px;">
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg tamil" onclick="window.location.href='index.html'">
        OTP அனுப்பு
      </button>

      <p style="text-align: center; margin-top: 24px; font-size: 14px;">
        <span class="tamil muted">கணக்கு இல்லையா?</span>
        <a href="register.html" class="tamil"
          style="color: var(--orange); text-decoration: none; font-weight: 600;">புதிதாக பதிவு செய்</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/language.js"></script>
</body>

</html>
