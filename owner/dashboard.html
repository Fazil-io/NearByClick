<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LokalMart Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body>

  <div class="owner-layout">
    <aside class="owner-sidebar">
      <div class="sidebar-logo tamil">Lokal<span>Mart</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link active tamil"><i class="fa fa-home"></i> என் கடை</a>
        <a href="orders.html" class="sidebar-link tamil"><i class="fa fa-bell"></i> ஆர்டர்கள் <span class="notif-badge" id="pending-count">3</span></a>
        <a href="products.html" class="sidebar-link tamil"><i class="fa fa-box"></i> பொருட்கள்</a>
        <a href="earnings.html" class="sidebar-link tamil"><i class="fa fa-rupee-sign"></i> சம்பாதிப்பு</a>
        <a href="credit.html" class="sidebar-link tamil"><i class="fa fa-book"></i> வாரி கணக்கு</a>
        <a href="settings.html" class="sidebar-link tamil"><i class="fa fa-cog"></i> Settings</a>
        <a href="../index.html" class="sidebar-link tamil" style="margin-top: auto;"><i class="fa fa-sign-out-alt"></i> வெளியேறு</a>
      </nav>
      <div class="open-toggle-wrap">
        <span class="tamil">கடை நிலை:</span>
        <label class="toggle-switch">
          <input type="checkbox" id="shop-open" checked onchange="toggleShopOpen()">
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label tamil" id="open-label">திறந்திருக்கிறது</span>
      </div>
    </aside>

    <main class="owner-main">
      <div class="section-head">
        <h2 class="tamil">வரவேற்கிறோம், Sri Murugan Grocery!</h2>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px;">
        <div class="card" style="border-left: 4px solid var(--orange);">
          <div style="font-size: 13px; color: var(--muted);" class="tamil">இன்றைய ஆர்டர்கள்</div>
          <div style="font-size: 28px; font-weight: 700; margin-top: 8px;">24</div>
        </div>
        <div class="card" style="border-left: 4px solid var(--green);">
          <div style="font-size: 13px; color: var(--muted);" class="tamil">இன்றைய வருமானம்</div>
          <div style="font-size: 28px; font-weight: 700; margin-top: 8px;">₹4,250</div>
        </div>
        <div class="card" style="border-left: 4px solid var(--red);">
          <div style="font-size: 13px; color: var(--muted);" class="tamil">வாரி கணக்கு</div>
          <div style="font-size: 28px; font-weight: 700; margin-top: 8px;">₹1,120</div>
        </div>
      </div>

      <h3 class="tamil" style="margin-bottom: 16px;">விரைவான செயல்கள்</h3>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <a href="orders.html" class="btn btn-primary tamil"><i class="fa fa-bell"></i> புதிய ஆர்டர்கள் பார்</a>
        <a href="credit.html" class="btn btn-outline tamil"><i class="fa fa-book"></i> வாரி எழுது</a>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/owner.js"></script>
</body>
</html>
