<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings - LokalMart Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/owner.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="owner-layout">
    <aside class="owner-sidebar">
      <div class="sidebar-logo tamil">Lokal<span>Mart</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link tamil"><i class="fa fa-home"></i> என் கடை</a>
        <a href="orders.html" class="sidebar-link tamil"><i class="fa fa-bell"></i> ஆர்டர்கள் <span class="notif-badge" id="pending-count">3</span></a>
        <a href="products.html" class="sidebar-link tamil"><i class="fa fa-box"></i> பொருட்கள்</a>
        <a href="earnings.html" class="sidebar-link active tamil"><i class="fa fa-rupee-sign"></i> சம்பாதிப்பு</a>
        <a href="credit.html" class="sidebar-link tamil"><i class="fa fa-book"></i> வாரி கணக்கு</a>
        <a href="settings.html" class="sidebar-link tamil"><i class="fa fa-cog"></i> Settings</a>
        <a href="../index.html" class="sidebar-link tamil" style="margin-top: auto;"><i class="fa fa-sign-out-alt"></i> வெளியேறு</a>
      </nav>
      <div class="open-toggle-wrap">
        <span class="tamil">கடை நிலை:</span>
        <label class="toggle-switch">
          <input type="checkbox" id="shop-open" checked onchange="toggleShopOpen()">
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label tamil" id="open-label">திறந்திருக்கிறது</span>
      </div>
    </aside>

    <main class="owner-main">
      <div class="section-head">
        <h2 class="tamil">சம்பாதிப்பு (Earnings)</h2>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px;">
        <div class="card" style="border-left: 4px solid var(--green);">
          <div style="font-size: 13px; color: var(--muted);" class="tamil">இன்றைய வருமானம்</div>
          <div style="font-size: 28px; font-weight: 700; margin-top: 8px;">₹4,250</div>
        </div>
        <div class="card" style="border-left: 4px solid var(--blue);">
          <div style="font-size: 13px; color: var(--muted);" class="tamil">இந்த வாரம்</div>
          <div style="font-size: 28px; font-weight: 700; margin-top: 8px;">₹24,800</div>
        </div>
      </div>

      <div class="card">
        <h3 class="tamil" style="margin-bottom: 16px;">வாராந்திர சம்பாதிப்பு</h3>
        <canvas id="earningsChart" style="width:100%; height:300px;"></canvas>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="dashboard.html" class="bottom-nav-item"><i class="fa fa-home"></i><span>என் கடை</span></a>
      <a href="orders.html" class="bottom-nav-item"><i class="fa fa-bell"></i><span>ஆர்டர்கள்</span></a>
      <a href="earnings.html" class="bottom-nav-item active"><i class="fa fa-rupee-sign"></i><span>சம்பாதிப்பு</span></a>
      <a href="settings.html" class="bottom-nav-item"><i class="fa fa-cog"></i><span>Settings</span></a>
    </div>
  </nav>

  <script src="../js/main.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/owner.js"></script>
  <script>
    const ctx = document.getElementById('earningsChart');
    if(ctx) {
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['திங்கள்', 'செவ்வாய்', 'புதன்', 'வியாழன்', 'வெள்ளி', 'சனி', 'ஞாயிறு'],
          datasets: [{
            label: 'வருமானம் (₹)',
            data: [3500, 4200, 3800, 4800, 5100, 6200, 4250],
            borderColor: '#16A34A',
            backgroundColor: 'rgba(22, 163, 74, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                font: { family: "'Noto Sans Tamil', sans-serif" }
              }
            }
          },
          scales: {
            x: { ticks: { font: { family: "'Noto Sans Tamil', sans-serif" } } },
            y: { beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
